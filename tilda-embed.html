<!-- V17: блок «Contact us» (rec1673903821) убирается со всех страниц —
     вместо него остаётся только нижняя полоса подвала (соцсети, меню,
     Privacy policy, копирайт — те же ссылки и шрифты, что в оригинале).
     Исключение: /contact — там блок остаётся как есть (решение Леры 13.08,
     форма живёт только на отдельной странице /apply).
     Вставляется в Настройки сайта → Вставка кода → HEAD. -->
<script>
(function () {
  var REC = 'rec1673903821';

  /* На странице «Контакты» родной блок с формой остаётся без изменений. */
  if (/^\/contact(\/|$)/.test(location.pathname)) return;

  function build() {
    var rec = document.getElementById(REC); if (!rec) return false;
    if (document.getElementById('v17-replace')) return true;
    var art = rec.querySelector('.t396__artboard'); if (!art) return false;
    art.style.display = 'none';

    var wrap = document.createElement('div');
    wrap.id = 'v17-replace';
    wrap.innerHTML =
      '<style>' +
      '#v17-replace{background:#010101}' +
      '#v17-strip{max-width:1200px;margin:0 auto;padding:56px 20px 40px;color:#F7F2EF;font-family:Manrope,Arial,sans-serif}' +
      '#v17-strip .v17-hr{height:1px;background:rgba(247,242,239,.25);margin:0 0 36px}' +
      '#v17-strip .v17-row{display:flex;align-items:flex-start;gap:40px;flex-wrap:wrap}' +
      '#v17-strip .v17-soc-title{font-size:16px;margin:0 0 16px}' +
      '#v17-strip .v17-icons{display:flex;gap:16px}' +
      '#v17-strip .v17-icons a{width:40px;height:40px;display:block}' +
      '#v17-strip .v17-icons img{width:40px;height:40px;display:block}' +
      '#v17-strip .v17-vline{width:1px;align-self:stretch;background:#F7F2EF;opacity:.9}' +
      '#v17-strip .v17-menu{display:flex;gap:32px;flex-wrap:wrap;padding-top:2px;flex:1;justify-content:flex-start}' +
      '#v17-strip .v17-menu a,#v17-strip .v17-right a{color:#F7F2EF;text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase}' +
      '#v17-strip .v17-menu a:hover,#v17-strip .v17-right a:hover{opacity:.7}' +
      '#v17-strip .v17-right{text-align:right;padding-top:6px}' +
      '#v17-strip .v17-mail{text-transform:none !important;font-size:14px !important;letter-spacing:0 !important}' +
      '#v17-strip .v17-copy{font-size:12px;opacity:.75;margin-top:14px}' +
      '@media(max-width:720px){#v17-strip .v17-row{flex-direction:column;gap:28px}#v17-strip .v17-vline{display:none}#v17-strip .v17-menu{justify-content:flex-start}#v17-strip .v17-right{text-align:left}}' +
      '</style>' +
      '<div id="v17-strip">' +
        '<div class="v17-hr"></div>' +
        '<div class="v17-row">' +
          '<div>' +
            '<p class="v17-soc-title">Our social media</p>' +
            '<div class="v17-icons">' +
              '<a href="https://x.com/V17_VC" target="_blank" rel="noopener" aria-label="X (Twitter)">' +
                '<img src="https://static.tildacdn.com/tild3339-6261-4130-a135-383030343730/twitter-x_2.svg" alt="X"></a>' +
              '<a href="https://www.linkedin.com/company/v17-vc/about/?viewAsMember=true" target="_blank" rel="noopener" aria-label="LinkedIn">' +
                '<img src="https://static.tildacdn.com/tild3066-3461-4863-a136-353865623031/link.svg" alt="LinkedIn"></a>' +
            '</div>' +
          '</div>' +
          '<div class="v17-vline"></div>' +
          '<nav class="v17-menu">' +
            '<a href="/">Main</a>' +
            '<a href="/#programs">Programs</a>' +
            '<a href="/blog">Blog</a>' +
            '<a href="/contact">Contact us</a>' +
          '</nav>' +
          '<div class="v17-right">' +
            '<a class="v17-mail" href="mailto:team@v17.vc">team@v17.vc</a>' +
            '<div style="height:10px"></div>' +
            '<a href="/policy">Privacy policy</a>' +
            '<div class="v17-copy">2025 © V17</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    art.parentNode.insertBefore(wrap, art.nextSibling);
    return true;
  }

  /* полоса подвала масштабируется как контент Тильды на широких экранах */
  function fitStrip() {
    var strip = document.getElementById('v17-strip');
    if (!strip) return;
    var s = window.innerWidth / 1200;
    strip.style.zoom = s > 1 ? s : '';
  }
  window.addEventListener('resize', fitStrip);

  /* зероблок рендерится скриптами Тильды — ждём появления */
  var tries = 0;
  var t = setInterval(function () {
    if (build()) { fitStrip(); clearInterval(t); }
    else if (++tries > 60) clearInterval(t);
  }, 400);
  document.addEventListener('DOMContentLoaded', build);
})();

/* Все кнопки APPLY по сайту ведут на страницу формы /apply.
   В зероблоках ссылки прописаны на /contact — переписываем на лету
   (в т.ч. в шапке и на плашке блога). Работает на всех страницах. */
(function () {
  function retarget() {
    document.querySelectorAll('a[href="/contact"], a[href="https://v17.vc/contact"]').forEach(function (a) {
      if (/^\s*apply\s*$/i.test(a.textContent)) a.setAttribute('href', '/apply');
    });
  }
  var n = 0;
  var t = setInterval(function () { retarget(); if (++n > 20) clearInterval(t); }, 500);
  document.addEventListener('DOMContentLoaded', retarget);
})();

/* Лого партнёров кликабельны (правка Леры 13.08). Все 5 лого — один общий
   SVG (Frame_2087328167) в зероблоке rec2925611001; поверх картинки кладём
   5 невидимых ссылок по зонам карточек (в долях ширины SVG 1429px,
   карточки по 280.625px с шагом 286.875px — работает на любом масштабе). */
(function () {
  var LINKS = [
    ['Yellow Rocks', 'https://yellowrocks.vc/'],
    ['AdQuantum', 'https://www.adquantum.com/'],
    ['MountFund', 'https://www.mountfund.com/'],
    ['Funders', 'https://www.funders.vc/'],
    ['D&P', 'https://www.linkedin.com/company/d-p-fund/']
  ];
  function decorate(el) {
    if (el.dataset.v17links) return;
    el.dataset.v17links = '1';
    var atom = el.querySelector('.tn-atom') || el;
    atom.style.position = 'relative';
    LINKS.forEach(function (l, i) {
      var a = document.createElement('a');
      a.href = l[1];
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', l[0]);
      a.style.cssText = 'position:absolute;top:0;height:100%;z-index:5;cursor:pointer;' +
        'width:19.64%;left:' + (i * 20.075).toFixed(3) + '%;';
      atom.appendChild(a);
    });
  }
  /* Тильда крутит лого «бегущей строкой» и клонирует элемент — вешаем
     ссылки на КАЖДУЮ копию картинки и следим за появлением новых клонов. */
  function buildAll() {
    var found = false;
    document.querySelectorAll('#rec2925611001 .tn-elem img').forEach(function (im) {
      if (im.src.indexOf('2087328167') > -1) {
        found = true;
        decorate(im.closest('.tn-elem'));
      }
    });
    return found;
  }
  var n = 0;
  var t = setInterval(function () {
    if (buildAll()) {
      clearInterval(t);
      var rec = document.getElementById('rec2925611001');
      if (rec && window.MutationObserver) {
        new MutationObserver(function () { buildAll(); })
          .observe(rec, { childList: true, subtree: true });
      }
    } else if (++n > 40) clearInterval(t);
  }, 500);

  /* Поверх бегущей строки лежат прозрачные слои соседних зероблоков и
     перехватывают клики. Поэтому дублируем: ловим клик на документе,
     по координатам определяем карточку и открываем её ссылку. */
  document.addEventListener('click', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('[data-v17links] a')) return;
    var box = null;
    document.querySelectorAll('#rec2925611001 .tn-elem[data-v17links]').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) box = r;
    });
    if (!box) return;
    var idx = Math.min(4, Math.floor((ev.clientX - box.left) / box.width / 0.20075));
    window.open(LINKS[idx][1], '_blank', 'noopener');
  });
  /* курсор-«рука» над строкой логотипов */
  document.addEventListener('mousemove', function (ev) {
    var over = false;
    document.querySelectorAll('#rec2925611001 .tn-elem[data-v17links]').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) over = true;
    });
    document.documentElement.style.cursor = over ? 'pointer' : '';
  });
})();

/* Анимация фигуры на главном экране (правка Леры 13.08): орбиты со звёздами
   (Frame_2087328170 / Group.svg в hero-блоке rec2957942901) плавно «парят». */
(function () {
  var css = '@keyframes v17-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(3deg)}}' +
    '#rec2957942901 .tn-elem[data-elem-id="1786543204958"] img,' +
    '#rec2957942901 .tn-elem[data-elem-id="1786543370346"] img' +
    '{animation:v17-float 7s ease-in-out infinite;will-change:transform}';
  var st = document.createElement('style');
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);
})();
</script>
